name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/sync.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sync-apk
          path: out/sync.apk

      - name: Publish Release (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version (sync.apk)
          body: |
            APK compilé automatiquement depuis le dernier commit sur main.
            Télécharge sync.apk ci-dessous et installe-le (par-dessus l'ancienne version pour mettre à jour).
          files: out/sync.apk
          make_latest: true
